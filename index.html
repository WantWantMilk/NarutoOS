        // ===== 音乐 (本地 + 在线平台) =====
        function renderMusic(body) {
            const platforms = [
                { name: '本地', type: 'local' },
                { name: 'QQ音乐', type: 'qq', url: 'https://y.qq.com/m/' },
                { name: '酷狗音乐', type: 'kugou', url: 'https://m.kugou.com/' },
                { name: '网易云音乐', type: 'netease', url: 'https://music.163.com/m/' }
            ];
            let currentPlatform = 0;
            let playlist = getStorage('musicPlaylist', []);
            let currentTrack = null,
                audio = new Audio(),
                currentIndex = -1;

            function renderLocalPlayer() {
                let html = `
                    <div class="upload-area">
                        <label for="musicFileInput">📤 上传音乐文件</label>
                        <input type="file" id="musicFileInput" accept="audio/*" multiple>
                    </div>
                    <div class="current-track" id="currentTrackDisplay">${currentTrack ? '正在播放: '+currentTrack : '未播放'}</div>
                    <div class="playback-controls">
                        <button id="musicPrev">⏮</button>
                        <button id="musicPlayPause">▶️</button>
                        <button id="musicNext">⏭</button>
                        <button id="musicStop">⏹</button>
                    </div>
                    <div class="playlist" id="musicPlaylist"></div>
                `;
                return html;
            }

            function renderOnlinePlayer(url) {
                return `<iframe class="music-iframe" src="${url}" loading="lazy" allow="autoplay; encrypted-media"></iframe>`;
            }

            function render() {
                let html = `
                    <div class="music-player">
                        <div class="tab-bar" id="musicTabBar">
                            ${platforms.map((p, i) => `<span class="tab ${i===currentPlatform?'active':''}" data-idx="${i}">${p.name}</span>`).join('')}
                        </div>
                        <div class="tab-content" id="musicTabContent"></div>
                    </div>
                `;
                body.innerHTML = html;

                const tabBar = document.getElementById('musicTabBar');
                tabBar.querySelectorAll('.tab').forEach(tab => {
                    tab.addEventListener('click', () => {
                        tabBar.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                        tab.classList.add('active');
                        currentPlatform = parseInt(tab.dataset.idx);
                        renderContent();
                    });
                });

                function renderContent() {
                    const content = document.getElementById('musicTabContent');
                    const platform = platforms[currentPlatform];
                    if (platform.type === 'local') {
                        content.innerHTML = renderLocalPlayer();
                        bindLocalEvents(content);
                    } else {
                        content.innerHTML = renderOnlinePlayer(platform.url);
                    }
                }

                function bindLocalEvents(container) {
                    const fileInput = container.querySelector('#musicFileInput');
                    if (fileInput) {
                        fileInput.addEventListener('change', (e) => {
                            const files = e.target.files;
                            for (let file of files) {
                                if (file.type.startsWith('audio/')) {
                                    const url = URL.createObjectURL(file);
                                    playlist.push({ name: file.name, url: url });
                                }
                            }
                            setStorage('musicPlaylist', playlist);
                            render();
                        });
                    }
                    const list = container.querySelector('#musicPlaylist');
                    if (list) {
                        if (playlist.length === 0) {
                            list.innerHTML =
                            '<div class="empty-state"><span class="big-emoji">🎵</span>暂无歌曲，请上传</div>';
                        } else {
                            playlist.forEach((track, idx) => {
                                const div = document.createElement('div');
                                div.className = 'track';
                                const isCurrent = idx === currentIndex;
                                div.innerHTML = `
                                    <span class="name" style="${isCurrent ? 'color:#e65100;' : ''}">${track.name}</span>
                                    <span class="controls">
                                        <button data-play="${idx}">▶️</button>
                                        <button data-del="${idx}">✕</button>
                                    </span>
                                `;
                                list.appendChild(div);
                            });
                            list.querySelectorAll('[data-play]').forEach(btn => {
                                btn.addEventListener('click', () => {
                                    const idx = parseInt(btn.dataset.play);
                                    playTrack(idx);
                                });
                            });
                            list.querySelectorAll('[data-del]').forEach(btn => {
                                btn.addEventListener('click', () => {
                                    const idx = parseInt(btn.dataset.del);
                                    playlist.splice(idx, 1);
                                    setStorage('musicPlaylist', playlist);
                                    if (currentIndex === idx) { audio.pause();
                                        currentTrack = null;
                                        currentIndex = -1; } else if (currentIndex > idx) currentIndex--;
                                    render();
                                });
                            });
                        }
                    }
                    const playPause = container.querySelector('#musicPlayPause');
                    const stopBtn = container.querySelector('#musicStop');
                    const prevBtn = container.querySelector('#musicPrev');
                    const nextBtn = container.querySelector('#musicNext');
                    if (playPause) {
                        playPause.addEventListener('click', () => {
                            if (audio.paused) {
                                if (currentTrack) audio.play();
                                else if (playlist.length > 0) playTrack(0);
                            } else {
                                audio.pause();
                            }
                        });
                    }
                    if (stopBtn) {
                        stopBtn.addEventListener('click', () => {
                            audio.pause();
                            audio.currentTime = 0;
                            const display = container.querySelector('#currentTrackDisplay');
                            if (display) display.textContent = currentTrack ? '已停止: ' + currentTrack :
                                '未播放';
                        });
                    }
                    if (prevBtn) {
                        prevBtn.addEventListener('click', () => {
                            if (playlist.length === 0) return;
                            let idx = currentIndex - 1;
                            if (idx < 0) idx = playlist.length - 1;
                            playTrack(idx);
                        });
                    }
                    if (nextBtn) {
                        nextBtn.addEventListener('click', () => {
                            if (playlist.length === 0) return;
                            let idx = currentIndex + 1;
                            if (idx >= playlist.length) idx = 0;
                            playTrack(idx);
                        });
                    }
                }

                function playTrack(idx) {
                    if (idx < 0 || idx >= playlist.length) return;
                    const track = playlist[idx];
                    audio.src = track.url;
                    audio.play();
                    currentTrack = track.name;
                    currentIndex = idx;
                    const display = document.querySelector('#currentTrackDisplay');
                    if (display) display.textContent = '正在播放: ' + track.name;
                    render();
                    audio.onended = () => {
                        let next = currentIndex + 1;
                        if (next >= playlist.length) next = 0;
                        playTrack(next);
                    };
                }

                renderContent();
                window._musicCleanup = () => {
                    audio.pause();
                    audio.src = '';
                };
            }
            render();
        }

        // ----- 浏览器 (自适应) -----
        function renderBrowser(body) {
            const defaultUrl =
                'https://www.baidu.com/from=844b/ssid=0/s?word=%E7%99%BE%E5%BA%A6&sa=tb&ts=0&t_kt=0&ie=utf-8&ms=1&rsv_t=acd1LJnWt40uIJlLGFtOBIzi%252F31n2IO2Mky8kWfJhcLQWWkP4zS5NWlc0g&rsv_pq=10925249139932774113&ss=100&sugid=278181384433411&rfrom=1024439f&rchannel=1024439j&rqid=10925249139932774113';
            let currentUrl = defaultUrl;
            const container = document.createElement('div');
            container.style.display = 'flex';
            container.style.flexDirection = 'column';
            container.style.flex = '1';
            container.innerHTML = `
                <div class="browser-bar">
                    <input type="text" id="browserUrl" value="${defaultUrl}" placeholder="输入网址">
                    <button id="browserGo">前往</button>
                    <button id="browserRefresh">🔄</button>
                </div>
                <div class="browser-frame" id="browserFrame">
                    <iframe src="${defaultUrl}" loading="lazy" allow="geolocation; microphone; camera; encrypted-media"></iframe>
                </div>
            `;
            body.appendChild(container);
            const urlInput = document.getElementById('browserUrl');
            const frame = container.querySelector('iframe');
            const goBtn = document.getElementById('browserGo');
            const refreshBtn = document.getElementById('browserRefresh');

            function navigate(url) {
                if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
                currentUrl = url;
                frame.src = url;
                urlInput.value = url;
            }
            goBtn.addEventListener('click', () => { const val = urlInput.value.trim(); if (val) navigate(val); });
            urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const val = urlInput.value.trim(); if (
                        val) navigate(val); } });
            refreshBtn.addEventListener('click', () => { frame.src = currentUrl; });
            frame.src = defaultUrl;
        }

        // ===== 设置 (增强版) =====
        function renderSettings(body) {
            let brightness = getStorage('brightness', 0.8);
            let volume = getStorage('volume', 0.6);
            let fontSize = getStorage('fontSize', 16);
            let theme = getStorage('theme', 'light'); // 'light' or 'dark'

            // 应用设置
            function applyBrightness(val) {
                brightness = val;
                setStorage('brightness', brightness);
                const phone = document.getElementById('phone');
                const v = Math.round(brightness * 100);
                phone.style.filter = `brightness(${v}%)`;
            }

            function applyVolume(val) {
                volume = val;
                setStorage('volume', volume);
                document.querySelectorAll('audio').forEach(a => a.volume = volume);
                window._globalVolume = volume;
            }

            function applyFontSize(val) {
                fontSize = val;
                setStorage('fontSize', fontSize);
                document.querySelector('.phone').style.fontSize = fontSize + 'px';
                // 调整部分元素，但不会全局覆盖，仅示意
            }

            function applyTheme(val) {
                theme = val;
                setStorage('theme', theme);
                const phone = document.getElementById('phone');
                if (theme === 'dark') {
                    phone.classList.add('dark-theme');
                } else {
                    phone.classList.remove('dark-theme');
                }
            }

            // 初始化
            applyBrightness(brightness);
            applyVolume(volume);
            applyFontSize(fontSize);
            applyTheme(theme);

            // 修正Audio构造函数
            const origAudio = window.Audio;
            window.Audio = function() {
                const a = new origAudio();
                a.volume = window._globalVolume || 0.6;
                return a;
            };

            const container = document.createElement('div');
            container.innerHTML = `
                <div class="setting-group">
                    <div class="setting-title">💡 亮度</div>
                    <div class="setting-row">
                        <span class="label">亮度</span>
                        <input type="range" id="brightnessSlider" min="0.1" max="1" step="0.05" value="${brightness}">
                        <span class="value" id="brightnessValue">${Math.round(brightness*100)}%</span>
                    </div>
                </div>
                <div class="setting-group">
                    <div class="setting-title">🔊 音量</div>
                    <div class="setting-row">
                        <span class="label">音量</span>
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="${volume}">
                        <span class="value" id="volumeValue">${Math.round(volume*100)}%</span>
                    </div>
                </div>
                <div class="setting-group">
                    <div class="setting-title">🔤 字体大小</div>
                    <div class="setting-row">
                        <span class="label">大小</span>
                        <input type="range" id="fontSizeSlider" min="12" max="24" step="1" value="${fontSize}">
                        <span class="value" id="fontSizeValue">${fontSize}px</span>
                    </div>
                </div>
                <div class="setting-group">
                    <div class="setting-title">🎨 主题</div>
                    <div class="setting-row">
                        <span class="label">深色模式</span>
                        <button class="btn" id="themeToggle">${theme === 'dark' ? '切换到浅色' : '切换到深色'}</button>
                    </div>
                </div>
                <div class="setting-group">
                    <div class="setting-title">🔐 锁屏密码</div>
                    <div class="setting-row">
                        <div class="setting-password-input">
                            <input type="password" id="settingsNewPassword" placeholder="4位数字" maxlength="4" inputmode="numeric" pattern="[0-9]*">
                            <button id="settingsSetPassword">设定</button>
                            <button id="settingsClearPassword" class="btn-secondary" style="background:#888;">清除</button>
                        </div>
                    </div>
                    <div class="setting-row" style="margin-top:8px;">
                        <span class="label" id="passwordStatus">当前状态: ${lockPassword ? '已设置' : '未设置'}</span>
                        <button class="btn" id="settingsLockNow">🔒 立即锁定</button>
                    </div>
                </div>
                <div class="setting-group">
                    <div class="setting-title">🗑️ 数据管理</div>
                    <div class="setting-row">
                        <span class="label">重置所有数据 (将清除所有应用数据)</span>
                        <button class="btn" id="resetAllData" style="background:#ff3b30;">重置</button>
                    </div>
                </div>
                <div class="setting-group">
                    <div class="setting-title">ℹ️ 关于</div>
                    <div class="setting-row">
                        <span class="label">NarutoOS v2.1</span>
                    </div>
                    <div class="setting-row">
                        <span class="label">应用数: ${APPS.length}</span>
                    </div>
                    <div class="setting-row">
                        <span class="label">存储占用: ~${Math.round(localStorage.length / 1024)} KB</span>
                    </div>
                </div>
            `;
            body.appendChild(container);

            // 亮度
            const brightnessSlider = document.getElementById('brightnessSlider');
            const brightnessValue = document.getElementById('brightnessValue');
            brightnessSlider.addEventListener('input', () => {
                const val = parseFloat(brightnessSlider.value);
                brightnessValue.textContent = Math.round(val * 100) + '%';
                applyBrightness(val);
            });

            // 音量
            const volumeSlider = document.getElementById('volumeSlider');
            const volumeValue = document.getElementById('volumeValue');
            volumeSlider.addEventListener('input', () => {
                const val = parseFloat(volumeSlider.value);
                volumeValue.textContent = Math.round(val * 100) + '%';
                applyVolume(val);
            });

            // 字体大小
            const fontSizeSlider = document.getElementById('fontSizeSlider');
            const fontSizeValue = document.getElementById('fontSizeValue');
            fontSizeSlider.addEventListener('input', () => {
                const val = parseInt(fontSizeSlider.value);
                fontSizeValue.textContent = val + 'px';
                applyFontSize(val);
            });

            // 主题切换
            document.getElementById('themeToggle').addEventListener('click', () => {
                const newTheme = theme === 'dark' ? 'light' : 'dark';
                applyTheme(newTheme);
                document.getElementById('themeToggle').textContent = newTheme === 'dark' ? '切换到浅色' : '切换到深色';
            });

            // 设置密码
            document.getElementById('settingsSetPassword').addEventListener('click', () => {
                const newPass = document.getElementById('settingsNewPassword').value.trim();
                if (newPass.length === 4 && /^\d{4}$/.test(newPass)) {
                    lockPassword = newPass;
                    setStorage('lockPassword', lockPassword);
                    alert('密码已设定为 ' + lockPassword);
                    document.getElementById('settingsNewPassword').value = '';
                    document.getElementById('passwordStatus').textContent = '当前状态: 已设置';
                } else {
                    alert('请输入4位数字密码');
                }
            });

            // 清除密码
            document.getElementById('settingsClearPassword').addEventListener('click', () => {
                if (confirm('确定清除锁屏密码吗？')) {
                    lockPassword = '';
                    setStorage('lockPassword', '');
                    alert('密码已清除');
                    document.getElementById('passwordStatus').textContent = '当前状态: 未设置';
                    if (isLocked) {
                        isLocked = false;
                        lockScreen.classList.remove('active');
                        lockBtn.textContent = '🔓';
                    }
                }
            });

            // 立即锁定
            document.getElementById('settingsLockNow').addEventListener('click', () => {
                if (lockPassword) {
                    lockPhone();
                } else {
                    alert('请先设定锁屏密码');
                }
            });

            // 重置所有数据
            document.getElementById('resetAllData').addEventListener('click', () => {
                if (confirm('确定重置所有数据吗？此操作不可撤销！')) {
                    localStorage.clear();
                    location.reload();
                }
            });
        }

        // ========== 初始化 ==========
        renderAll();
        console.log('🍥 NarutoOS 已启动! (电话布局修复，地图/浏览器自适应，设置增强)');
    </script>
